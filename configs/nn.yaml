# Neural-network pricer training configuration.
# This file documents the hyperparameters used for the checkpoint referenced
# in the final report (Deliverable: "Random seeds are stated in code or report").

seed: 42
n_samples: 10000
binomial_label_steps: 500   # CRR steps used to generate training labels
hidden_dim: 256
epochs: 200
batch_size: 256
learning_rate: 0.001
train_val_test_split: [0.8, 0.1, 0.1]

# Training ranges (also enforced in src/data/synthetic_contracts.py)
ranges:
  S0: [60.0, 140.0]
  K: [80.0, 120.0]
  T: [0.05, 2.0]
  r: [0.0, 0.10]
  sigma: [0.10, 0.50]
